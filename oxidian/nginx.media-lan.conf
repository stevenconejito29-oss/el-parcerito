# ═════════════════════════════════════════════════════════════════
# Rutas LAN para servicios de media (no expuestas al público)
# Usa resolver Docker + variable para sobrevivir a upstreams offline.
# ═════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name musica.local musica.home;

    client_max_body_size 100M;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $navidrome_backend http://navidrome:4533;

    location / {
        proxy_pass $navidrome_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name fotos.local fotos.home;

    client_max_body_size 5G;
    proxy_request_buffering off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $immich_backend http://immich-server:2283;

    location / {
        proxy_pass $immich_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    listen 80;
    server_name descargar.local descargar.home;

    client_max_body_size 10M;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $downloader_backend http://music-downloader:5000;

    location / {
        proxy_pass $downloader_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}
