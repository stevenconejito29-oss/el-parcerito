{% extends "admin_base.html" %}
{% block title %}Franjas de reparto — Repartidor{% endblock %}
{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/delivery-franjas.css', v=asset_version) }}">
{% endblock %}
{% block content %}
<div class="df-container">
  <div class="df-header">
    <div>
      <h1>Franjas de reparto</h1>
      <p>Toma las franjas que quieras cubrir esta semana. El admin ve tu asignación en tiempo real.</p>
    </div>
  </div>

  <div id="df-msgs"></div>
  <div id="df-cal">
    <p class="df-day-empty">Cargando franjas…</p>
  </div>
</div>

<script src="{{ url_for('static', filename='js/delivery-franjas.js', v=asset_version) }}"></script>
<script nonce="{{ csp_nonce() }}">
(function () {
  const DF = window.DeliveryFranjas;
  const cal = document.getElementById("df-cal");
  const msgs = document.getElementById("df-msgs");

  async function cargar() {
    const { ok, status, data } = await DF.apiFetch("{{ url_for('repartidor.franjas_listar') }}");
    if (!ok) {
      cal.innerHTML = `<p class="df-day-empty">Error al cargar (HTTP ${status}).</p>`;
      return;
    }
    render(data.franjas || []);
  }

  function render(franjas) {
    if (!franjas.length) {
      cal.innerHTML = `<p class="df-day-empty">No hay franjas planificadas para los próximos 7 días.</p>`;
      return;
    }
    const html = DF.agruparPorFecha(franjas).map(([fecha, slots]) => {
      const rows = slots.map(s => {
        const clases = ["df-slot"];
        if (s.tomada_por_mi) clases.push("df-slot-mia");
        if (s.llena_de_repartidores && !s.tomada_por_mi) clases.push("df-slot-llena");
        const btnRider = s.tomada_por_mi
          ? `<button class="df-btn df-btn-danger" data-act="liberar" data-id="${s.id}">Liberar franja</button>`
          : (s.llena_de_repartidores
              ? `<button class="df-btn" disabled>Sin cupo repartidor</button>`
              : `<button class="df-btn df-btn-primary" data-act="tomar" data-id="${s.id}">Tomar franja</button>`);
        // Batch dispatch: solo tiene sentido si tomé la franja Y hay pedidos listos.
        const listos = s.pedidos_listos || 0;
        const total = s.pedidos_total || 0;
        const op = s.operativa || {estado:'proxima', segundos:0};
        const tanda = Math.min(listos, s.pedidos_por_salida || 3);
        const batchBtn = (s.tomada_por_mi && listos > 0 && op.estado === 'activa')
          ? `<button class="df-btn df-btn-primary" data-act="elegir" data-id="${s.id}">🎒 Elegir tanda</button>`
          : (s.tomada_por_mi && op.estado === 'proxima'
              ? `<span class="df-slot-meta">Disponible al comenzar la franja</span>` : "");
        const conteo = total > 0
          ? `<div class="df-slot-meta"><strong>${total} pedido${total===1?'':'s'}</strong>${listos>0?` · ${listos} listo${listos===1?'':'s'} para salir`:''}</div>`
          : `<div class="df-slot-meta" style="color:#999">Sin pedidos aún</div>`;
        return `<div class="${clases.join(' ')}">
          <div class="df-slot-hora">${s.hora_inicio}–${s.hora_fin}</div>
          <div class="df-slot-meta">
            Riders ${s.repartidores_activos}/${s.max_repartidores} · Cap ${s.capacidad_max} pedidos
          </div>
          <div class="df-slot-meta"><strong>${op.estado === 'activa' ? 'Franja en curso' : op.estado === 'finalizada' ? 'Franja finalizada' : 'Próxima franja'}</strong>${op.estado === 'activa' ? ` · ${Math.ceil(op.segundos/60)} min restantes` : ''}</div>
          ${conteo}
          <div class="df-slot-actions">${btnRider} ${batchBtn}</div>
          <div class="df-batch-picker" data-picker="${s.id}" hidden></div>
        </div>`;
      }).join("");
      return `<div class="df-day">
        <div class="df-day-head"><span class="df-day-title">${DF.fmtFecha(fecha)}</span></div>
        <div class="df-slot-list">${rows}</div>
      </div>`;
    }).join("");
    cal.innerHTML = html;
  }

  cal.addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const id = btn.dataset.id;
    if (btn.dataset.act === "elegir") {
      await cargarPedidos(id, btn);
      return;
    }
    const url = btn.dataset.act === "tomar"
      ? `/repartidor/franjas/${id}/tomar`
      : `/repartidor/franjas/${id}/liberar`;
    const { ok, data } = await DF.apiFetch(url, { method: "POST" });
    if (ok) { DF.msg(msgs, btn.dataset.act === "tomar" ? "Franja tomada." : "Franja liberada.", "ok"); cargar(); }
    else DF.msg(msgs, (data && data.error) ? `Error: ${data.error}` : "Error", "err");
  });

  const esc = value => String(value ?? "").replace(/[&<>'"]/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'
  })[ch]);

  async function cargarPedidos(id, button) {
    const picker = cal.querySelector(`[data-picker="${id}"]`);
    if (!picker) return;
    if (!picker.hidden) { picker.hidden = true; return; }
    button.disabled = true;
    const { ok, data } = await DF.apiFetch(`/repartidor/franjas/${id}/pedidos`);
    button.disabled = false;
    if (!ok) { DF.msg(msgs, "No se pudieron cargar los pedidos de la franja.", "err"); return; }
    const disponibles = (data.pedidos || []).filter(p => p.estado === 'listo' && (!p.repartidor_id || p.repartidor_id === {{ current_user.id }}));
    if (!disponibles.length) { DF.msg(msgs, "Ya no quedan pedidos listos en esta franja.", "err"); cargar(); return; }
    const limite = data.limites || {pedidos:3, peso_gramos:12000};
    picker.innerHTML = `<form class="js-iniciar-tanda" data-max-orders="${limite.pedidos}" data-max-weight="${limite.peso_gramos}" method="POST" action="/repartidor/franjas/${id}/iniciar-reparto">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <p class="df-slot-meta"><strong>Arma tu mochila</strong> · máximo ${limite.pedidos} pedidos y ${(limite.peso_gramos/1000).toFixed(1)} kg</p>
      <div class="df-batch-orders">${disponibles.map(p => `<label class="df-batch-order">
        <input type="checkbox" name="pedido_ids" value="${p.id}" data-weight="${p.peso_gramos}">
        <span><strong>${esc(p.numero_pedido)}</strong><small>${esc(p.zona || p.direccion)} · ${p.items} artículo(s)</small></span>
        <b>${(p.peso_gramos/1000).toFixed(1)} kg</b>
      </label>`).join('')}</div>
      <div class="df-batch-summary" aria-live="polite">Selecciona lo que realmente puedes llevar.</div>
      <button class="df-btn df-btn-primary" type="submit" disabled>Iniciar ruta seleccionada</button>
    </form>`;
    picker.hidden = false;
  }

  cal.addEventListener('change', e => {
    if (!e.target.matches('.df-batch-order input')) return;
    const form = e.target.form;
    const checked = [...form.querySelectorAll('input[name="pedido_ids"]:checked')];
    const all = [...form.querySelectorAll('input[name="pedido_ids"]')];
    const maxPedidos = Number(form.dataset.maxOrders);
    const weight = checked.reduce((sum, input) => sum + Number(input.dataset.weight || 0), 0);
    const summary = form.querySelector('.df-batch-summary');
    const submit = form.querySelector('button[type="submit"]');
    const maxWeight = Number(form.dataset.maxWeight);
    const valid = checked.length > 0 && checked.length <= maxPedidos && weight <= maxWeight;
    summary.textContent = `${checked.length} pedido(s) · ${(weight/1000).toFixed(1)} kg${valid ? ' · Lista para salir' : ' · Ajusta la selección'}`;
    submit.disabled = !valid;
    all.forEach(input => { if (!input.checked) input.disabled = checked.length >= maxPedidos || weight + Number(input.dataset.weight || 0) > maxWeight; });
  });

  cal.addEventListener("submit", (e) => {
    const form = e.target.closest("form.js-iniciar-tanda");
    const cuantos = form ? form.querySelectorAll('input[name="pedido_ids"]:checked').length : 0;
    if (form && !window.confirm(`¿Confirmas que sales con ${cuantos} pedido(s)?`)) {
      e.preventDefault();
    }
  });

  cargar();
})();
</script>
{% endblock %}
