# ═════════════════════════════════════════════════════════════════
# Servicios auxiliares — LAN
#
# LAN (nombres *.local resueltos por mDNS/hosts, o IP directa+puerto):
#   - links.local            → Shlink UI (web client)
#   - stats.local            → Umami
# ═════════════════════════════════════════════════════════════════

# ─── Shlink UI (LAN) ─────────────────────────────────────────────
server {
    listen 80;
    server_name links.local links.home;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $shlink_ui_backend http://shlink-ui:8080;

    location / {
        proxy_pass $shlink_ui_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── Umami (LAN) ─────────────────────────────────────────────────
server {
    listen 80;
    server_name stats.local stats.home;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $umami_backend http://umami:3000;

    location / {
        proxy_pass $umami_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
