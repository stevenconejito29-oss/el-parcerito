# ═════════════════════════════════════════════════════════════════
# Servicios auxiliares — LAN + un solo vhost público (pdf.elparcerito.com)
#
# LAN (nombres *.local resueltos por mDNS/hosts, o IP directa+puerto):
#   - links.local            → Shlink UI (web client)
#   - stats.local            → Umami
# Público (vía Cloudflare Tunnel):
#   - pdf.elparcerito.com    → Stirling-PDF (herramientas documentos)
# ═════════════════════════════════════════════════════════════════

# ─── Stirling-PDF (público) ──────────────────────────────────────
server {
    listen 80;
    server_name pdf.elparcerito.com;

    client_max_body_size 500M;
    proxy_request_buffering off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $stirling_backend http://stirling:8080;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass $stirling_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# ─── Shlink UI (LAN) ─────────────────────────────────────────────
server {
    listen 80;
    server_name links.local links.home;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $shlink_ui_backend http://shlink-ui:8080;

    location / {
        proxy_pass $shlink_ui_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── Umami (LAN) ─────────────────────────────────────────────────
server {
    listen 80;
    server_name stats.local stats.home;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $umami_backend http://umami:3000;

    location / {
        proxy_pass $umami_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
